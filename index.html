<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Facebook</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      color: #111827;
    }
    .card {
      width: min(420px, 100%);
      text-align: center;
      background: #fff;
      border-radius: 20px;
      padding: 32px 24px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 10px; font-size: 28px; }
    p { margin: 0 0 24px; color: #667085; }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 52px;
      padding: 14px 20px;
      border-radius: 12px;
      background: #1877f2;
      color: white;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
    }
    .button:active { transform: scale(.99); }
    .note { margin-top: 16px; font-size: 12px; color: #98a2b3; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Facebook</h1>
    <p>Open the official Facebook website.</p>

    <a
      class="button"
      href="https://www.facebook.com/"
      target="_blank"
      rel="noopener noreferrer"
      id="facebookButton"
    >
      Open Facebook
    </a>

    <div class="note">This button opens Facebook's official website.</div>
  </main>

  <script>
    // Tell Telegram that the Mini App is ready.
    if (window.Telegram && Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }

    // Keep the action as a direct user tap so the browser can open
    // Facebook normally rather than trying to embed Facebook in the Mini App.
    document.getElementById("facebookButton").addEventListener("click", function () {
      if (window.Telegram && Telegram.WebApp && Telegram.WebApp.HapticFeedback) {
        Telegram.WebApp.HapticFeedback.impactOccurred("light");
      }
    });
  </script>
</body>
</html>
